services:
  postgres:
    image: postgres:16
    container_name: service-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_manager
    ports:
      - "5432:5432"
    volumes:
      - service_manager_pgdata:/var/lib/postgresql/data

volumes:
  service_manager_pgdata: